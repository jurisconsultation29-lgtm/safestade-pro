<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SafeStade Pro — SOC · Cyberdéfense · GRC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C1272D; --red-deep:#7C1A1F; --red-ink:#4A1013;
    --red-t08:rgba(193,39,45,0.08); --red-t14:rgba(193,39,45,0.14); --red-t22:rgba(193,39,45,0.24);
    --green:#006233; --green-deep:#013D20; --green-ink:#012814;
    --green-t08:rgba(0,98,51,0.10); --green-t14:rgba(0,98,51,0.16); --green-t22:rgba(0,98,51,0.26);
    --white:#FFFFFF; --ink:#EAF3EE; --ink-soft:rgba(234,243,238,0.62); --bg:#0E1B15; --line:rgba(234,243,238,0.14);
    --card:#0F3A22; --card-strong:#164A2B; --nav-bg:#4A1013;
    --red-light:#FF6B72; --green-light:#4CD68A;
    --display:'Chakra Petch',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0A130E;font-family:var(--body);color:var(--ink);min-height:100vh;}
  .device{width:100%;max-width:100%;background:linear-gradient(180deg,#0C2417 0%,#0A2015 60%,#091C13 100%);min-height:100vh;}
  .device-frame{position:relative;max-width:1280px;margin:0 auto;padding-bottom:90px;}
  button{font-family:var(--body);cursor:pointer;border:none;background:none;}

  /* HEADER */
  .header{position:relative;background:var(--nav-bg);padding:26px 48px 30px;color:var(--white);overflow:hidden;}
  .zellige{position:absolute;inset:0;opacity:0.14;pointer-events:none;}
  .header-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.3);border-radius:10px;}
  .brand-text .eyebrow{font-family:var(--display);font-size:9.5px;letter-spacing:.13em;color:rgba(255,255,255,.72);}
  .brand-text .title{font-family:var(--display);font-size:15px;font-weight:700;}
  .org-badge{font-size:10px;font-weight:600;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:5px 10px;border-radius:999px;}
  .head-actions{display:flex;align-items:center;gap:8px;}
  .role-btn{color:var(--white);cursor:pointer;}
  .bell-btn{position:relative;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:var(--white);font-size:14px;display:flex;align-items:center;justify-content:center;}
  .bell-dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--green-light);border:1px solid var(--red-ink);}
  .notif-panel{display:none;position:absolute;top:64px;right:18px;width:250px;background:var(--card-strong);border:1px solid var(--line);border-radius:14px;padding:10px;z-index:30;box-shadow:0 14px 30px rgba(0,0,0,.4);}
  .notif-panel.open{display:block;}
  .notif-item{font-size:11px;padding:8px 6px;border-bottom:1px solid var(--line);color:var(--ink);}
  .notif-item:last-child{border-bottom:none;}
  .notif-item b{display:block;font-size:11.5px;margin-bottom:2px;}
  .header-screen-title{position:relative;z-index:2;margin-top:16px;font-family:var(--display);font-size:18px;font-weight:600;}
  .header-screen-sub{position:relative;z-index:2;margin-top:4px;font-size:11.5px;color:rgba(255,255,255,.78);max-width:290px;line-height:1.5;}

  /* TABS (secondary nav inside header) */
  .tabbar{display:flex;gap:10px;margin-top:20px;position:relative;z-index:2;overflow-x:visible;}
  .tab{flex-shrink:0;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.75);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);padding:11px 22px;border-radius:10px;}
  .tab.active{background:var(--card-strong);color:var(--white);}

  /* CONTENT */
  .content{padding:0 48px 30px;margin-top:-10px;position:relative;z-index:3;min-height:420px;}
  .screen{display:none;}
  .screen.active{display:block;animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:20px 0 11px;}
  .section-title:first-child{margin-top:16px;}
  .section-title h2{font-family:var(--display);font-size:14px;font-weight:600;}
  .section-title .tag{font-size:10.5px;color:var(--ink-soft);}

  /* KPI GRID */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .kpi{border-radius:16px;padding:14px;border:1px solid var(--line);position:relative;overflow:hidden;}
  .kpi.safe{background:linear-gradient(155deg,var(--green-t22),var(--card) 65%);}
  .kpi.alert{background:linear-gradient(155deg,var(--red-t22),var(--card) 65%);}
  .kpi{border-left:3px solid transparent;}
  .kpi.safe{border-left-color:var(--green);}
  .kpi.alert{border-left-color:var(--red);}
  .kpi .kpi-num{font-family:var(--display);font-size:23px;font-weight:700;}
  .kpi.safe .kpi-num{color:var(--green);}
  .kpi.alert .kpi-num{color:var(--red);}
  .kpi .kpi-label{font-size:10.5px;color:var(--ink-soft);margin-top:2px;font-weight:500;}
  .kpi .kpi-delta{font-size:9.5px;font-weight:700;margin-top:6px;display:inline-block;padding:2px 7px;border-radius:999px;}
  .kpi.safe .kpi-delta{background:var(--green-t22);color:var(--green-light);}
  .kpi.alert .kpi-delta{background:var(--red-t22);color:var(--red-light);}

  /* generic row card */
  .row-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;width:100%;text-align:left;}
  .row-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .row-icon.crit{background:var(--red-t14);} .row-icon.watch{background:var(--red-t08);} .row-icon.ok{background:var(--green-t08);}
  .row-text{flex:1;min-width:0;} .row-title{font-size:12.5px;font-weight:600;} .row-meta{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .row-tag{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:4px 9px;border-radius:999px;flex-shrink:0;margin-left:6px;}
  .row-tag.crit{background:var(--red);color:var(--white);} .row-tag.watch{background:var(--red-t22);color:var(--red-light);} .row-tag.ok{background:var(--green-t22);color:var(--green-light);}

  .filter-row{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap;}
  .mitre-tag{font-size:10px;color:var(--green-light);background:var(--green-t14);border:1px solid var(--green-t22);border-radius:8px;padding:5px 9px;display:inline-block;}
  .xai-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;}
  .xai-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .xai-title{font-size:12.5px;font-weight:600;flex:1;}
  .xai-conf{font-size:9.5px;font-weight:700;background:var(--green-t14);color:var(--green-light);padding:3px 8px;border-radius:999px;flex-shrink:0;}
  .xai-why{display:none;font-size:11px;color:var(--ink-soft);margin-top:9px;line-height:1.6;border-top:1px solid var(--line);padding-top:9px;}
  .xai-why.open{display:block;}
  .xai-toggle{font-size:10.5px;font-weight:700;color:var(--green-light);margin-top:6px;}
  .led-dot{width:20px;height:20px;border-radius:50%;background:#333;border:2px solid var(--line);box-shadow:none;transition:.2s;}
  .led-dot.red{background:var(--red);box-shadow:0 0 14px 3px var(--red);border-color:var(--red);}
  .led-dot.green{background:var(--green-light);box-shadow:0 0 14px 3px var(--green-light);border-color:var(--green-light);}
  .fingerprint-zone{margin-top:10px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;transition:.2s;}
  .fingerprint-zone:hover{border-color:var(--green);}
  .fp-icon{font-size:38px;transition:.3s;}
  .fp-icon.scanning{animation:fpPulse .6s infinite;}
  .fp-icon.success{filter:none;}
  @keyframes fpPulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.12);}}
  .fp-label{font-size:11.5px;color:var(--ink-soft);margin-top:8px;font-weight:600;}
  .filter-chip{font-size:10.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
  .filter-chip.active{background:var(--red);border-color:var(--red);color:var(--white);}

  /* GRC compliance bars */
  .compliance-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 15px;margin-bottom:10px;}
  .compliance-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .compliance-head .cname{font-size:12.5px;font-weight:600;}
  .compliance-head .cpct{font-family:var(--display);font-size:13px;font-weight:700;}
  .compliance-head .cpct.high{color:var(--green-light);} .compliance-head .cpct.mid{color:var(--red-light);}
  .bar-outer{height:8px;border-radius:999px;background:var(--red-t14);overflow:hidden;}
  .bar-inner{height:100%;background:var(--green);border-radius:999px;}
  .compliance-meta{font-size:10px;color:var(--ink-soft);margin-top:6px;}

  /* risk register */
  .risk-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;}
  .risk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .risk-name{font-size:12.5px;font-weight:600;flex:1;}
  .risk-meta-row{display:flex;gap:14px;margin-top:9px;}
  .risk-meta-item{font-size:10px;color:var(--ink-soft);}
  .risk-meta-item b{display:block;font-size:11.5px;color:var(--ink);font-weight:700;margin-top:1px;}

  /* tickets */
  .cat-row{display:flex;gap:7px;margin-bottom:14px;overflow-x:auto;}
  .cat-chip{flex-shrink:0;font-size:10.5px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink-soft);}
  .cat-chip.active{background:var(--green);border-color:var(--green);color:var(--white);}
  .new-ticket-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;background:var(--red);color:var(--white);font-size:12.5px;font-weight:700;padding:13px;border-radius:13px;margin-bottom:14px;}
  .ticket-form{display:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px;}
  .ticket-form.open{display:block;animation:fadein .2s ease;}
  .ticket-form label{font-size:11px;font-weight:600;color:var(--ink-soft);display:block;margin:10px 0 5px;}
  .ticket-form label:first-child{margin-top:0;}
  .ticket-form input, .ticket-form select, .ticket-form textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--bg);font-family:inherit;color:var(--ink);}
  .ticket-form textarea{resize:none;height:50px;}
  .row2{display:flex;gap:8px;} .row2>div{flex:1;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .form-actions button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:12px;}
  .btn-cancel{background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);}
  .btn-submit{background:var(--green);color:var(--white);}
  .ticket-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;}
  .tc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .tc-id{font-size:9.5px;color:var(--ink-soft);font-weight:700;letter-spacing:.03em;}
  .tc-title{font-size:12.5px;font-weight:600;margin-top:3px;}
  .tc-meta{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .pill{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;}
  .pill.cat{background:var(--green-t22);color:var(--green-light);}
  .pill.crit{background:var(--red);color:var(--white);}
  .pill.med{background:var(--red-t22);color:var(--red-light);}
  .pill.low{background:var(--green-t22);color:var(--green-light);}
  .pill.status-open{background:var(--red-t14);color:var(--red-light);border:1px solid var(--red-t22);}
  .pill.status-done{background:var(--green-t14);color:var(--green-light);border:1px solid var(--green-t22);}
  .tc-resolve{margin-left:auto;font-size:10px;font-weight:700;color:var(--red);}

  /* OUTILS */
  .outil-panel{display:none;} .outil-panel.active{display:block;animation:fadein .2s ease;}
  .tool-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:14px;}
  .content .screen{max-width:760px;}
  .screen#screen-dashboard, .screen#screen-soc{max-width:100%;}
  .grc-report-view{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;}
  .grc-report-view pre{white-space:pre-wrap;word-break:break-word;font-family:'Courier New',monospace;font-size:11px;color:var(--ink);line-height:1.6;max-height:340px;overflow-y:auto;}
  .grc-report-view .grc-actions{display:flex;gap:8px;margin-top:12px;}
  .grc-report-view .grc-actions button{flex:1;padding:10px;border-radius:9px;font-size:11.5px;font-weight:700;background:var(--card-strong);border:1px solid var(--line);color:var(--ink);}
  .tool-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;}
  .tool-title{font-family:var(--display);font-size:13.5px;font-weight:600;}
  .sim-badge{font-size:9.5px;font-weight:700;background:var(--red-t22);color:var(--red-light);padding:4px 9px;border-radius:999px;}
  .sim-badge.on{background:var(--green-t22);color:var(--green-light);}
  .tool-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;margin-bottom:12px;}
  .tool-label{font-size:10.5px;font-weight:600;color:var(--ink-soft);display:block;margin:10px 0 5px;}
  .tool-input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:12.5px;background:var(--card-strong);color:var(--ink);font-family:inherit;}
  .tool-btn{width:100%;padding:11px;border-radius:10px;font-weight:700;font-size:12.5px;margin-top:8px;}
  .tool-btn.primary{background:var(--red);color:var(--white);}
  .tool-btn.ghost{background:var(--card-strong);border:1px solid var(--line);color:var(--ink);}
  .tool-btn.small{margin-top:0;}
  .btn-pair{display:flex;gap:8px;margin-top:8px;} .btn-pair .tool-btn{flex:1;}
  .tool-note{font-size:10.5px;color:var(--ink-soft);margin-top:12px;line-height:1.5;}
  .device-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:600;}
  .state-pill{font-size:9.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--red-t22);color:var(--red-light);}
  .state-pill.on{background:var(--green-t22);color:var(--green-light);}
  .chip-select{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .mini-chip{font-size:10.5px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--card-strong);border:1px solid var(--line);color:var(--ink-soft);}
  .mini-chip.active{background:var(--red);border-color:var(--red);color:var(--white);}
  .audit-row{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:7px;font-size:11px;}
  .audit-row .a-cmd{font-weight:700;} .audit-row .a-time{color:var(--ink-soft);font-size:10px;}
  .scan-result{margin-top:14px;border-radius:14px;padding:14px;text-align:center;}
  .scan-result.valid{background:var(--green-t22);border:1px solid var(--green-t22);}
  .scan-result.invalid, .scan-result.used, .scan-result.suspicious{background:var(--red-t22);border:1px solid var(--red-t22);}
  .scan-result .sr-label{font-family:var(--display);font-size:15px;font-weight:700;}
  .scan-result.valid .sr-label{color:var(--green-light);}
  .scan-result.invalid .sr-label, .scan-result.used .sr-label, .scan-result.suspicious .sr-label{color:var(--red-light);}
  .scan-result .sr-meta{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}
  .fraud-alert{margin-top:10px;background:var(--red-t14);border:1px solid var(--red-t22);border-radius:12px;padding:11px;font-size:11.5px;color:var(--red-light);}
  .fraud-alert button{margin-top:8px;background:var(--red);color:var(--white);font-size:11px;font-weight:700;padding:8px 12px;border-radius:9px;}
  .press-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px;margin-bottom:10px;}
  .press-btn{background:var(--red-t14);border:1px solid var(--red-t22);border-radius:12px;padding:12px 8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--red-light);}

  /* toast */
  .toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--white);font-size:12px;font-weight:600;padding:11px 15px;border-radius:12px;text-align:center;z-index:50;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 24px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translateY(-4px);}

  /* BOTTOM NAV */
  .bottom-nav{position:absolute;left:0;right:0;bottom:0;background:var(--nav-bg);border-top:1px solid var(--line);display:flex;justify-content:center;gap:60px;padding:14px 4px 16px;z-index:10;}
  .bottom-nav .nav-item{flex:none;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-soft);}
  .nav-item .nav-label{font-size:9px;font-weight:600;}
  .nav-item.active{color:var(--white);}
  .nav-item.active .nav-icon-wrap{background:var(--green);border-radius:10px;}
  .nav-icon-wrap{width:32px;height:26px;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div class="device"><div class="device-frame">

  <!-- HEADER -->
  <div class="header">
    <svg class="zellige" viewBox="0 0 400 200" preserveAspectRatio="none">
      <defs><pattern id="zpat" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M20 2 L38 20 L20 38 L2 20 Z" fill="none" stroke="white" stroke-width="0.8"/>
        <path d="M20 10 L30 20 L20 30 L10 20 Z" fill="none" stroke="white" stroke-width="0.6"/>
      </pattern></defs>
      <rect width="400" height="200" fill="url(#zpat)"/>
    </svg>
    <div class="header-top">
      <div class="brand">
        <div class="brand-mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 5V11C4 16 7.5 20.2 12 22C16.5 20.2 20 16 20 11V5L12 2Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        <div class="brand-text"><div class="eyebrow">MAROC · SOC PLATFORM</div><div class="title">SafeStade Pro</div></div>
      </div>
      <div class="head-actions">
        <button class="bell-btn" onclick="toggleNotifPanel()">🔔<span class="bell-dot" id="notifDot"></span></button>
        <button class="org-badge role-btn" id="roleBtn" onclick="cycleRole()">👤 Admin</button>
      </div>
    </div>
    <div class="notif-panel" id="notifPanel"></div>
    <div id="headerTitle" class="header-screen-title">Tableau de bord</div>
    <div id="headerSub" class="header-screen-sub">Stade de Rabat — SOC, cyberdéfense et conformité</div>

    <div class="tabbar" id="tabbar">
      <button class="tab active" data-nav="dashboard" onclick="showScreen('dashboard')">Dashboard</button>
      <button class="tab" data-nav="securite" onclick="showScreen('securite')">Sécurité</button>
      <button class="tab" data-nav="soc" onclick="showScreen('soc')">SOC</button>
      <button class="tab" data-nav="grc" onclick="showScreen('grc')">Conformité</button>
      <button class="tab" data-nav="tickets" onclick="showScreen('tickets')">Tickets</button>
      <button class="tab" data-nav="outils" onclick="showScreen('outils')">Outils</button>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- ============ DASHBOARD ============ -->
    <div class="screen active" id="screen-dashboard">
      <div class="section-title"><h2>Indicateurs clés</h2></div>
      <div class="kpi-grid">
        <div class="kpi safe"><div class="kpi-num">87%</div>
